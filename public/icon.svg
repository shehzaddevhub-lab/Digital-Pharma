<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle Inner Ring -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="#ffffff" stroke-width="6" opacity="0.15"/>

  <!-- Medical Cross -->
  <g filter="url(#shadow)">
    <!-- Vertical Arm -->
    <rect x="206" y="106" width="100" height="300" rx="28" fill="url(#crossGrad)" stroke="#ffffff" stroke-width="12" stroke-linejoin="round"/>
    <!-- Horizontal Arm -->
    <rect x="106" y="206" width="300" height="100" rx="28" fill="url(#crossGrad)" stroke="#ffffff" stroke-width="12" stroke-linejoin="round"/>
    <!-- Center Emblem -->
    <circle cx="256" cy="256" r="38" fill="#ffffff"/>
    <path d="M256 236 L256 276 M236 256 L276 256" stroke="#16a34a" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- AI / Smart Sparkle -->
  <circle cx="395" cy="115" r="26" fill="url(#pillGrad)" stroke="#ffffff" stroke-width="8"/>
  <path d="M395 95 L398 112 L415 115 L398 118 L395 135 L392 118 L375 115 L392 112 Z" fill="#ffffff"/>

  <!-- Pill Emblem at Bottom Right -->
  <g transform="translate(330, 330) rotate(-45)">
    <rect x="0" y="0" width="70" height="35" rx="17.5" fill="#f8fafc" stroke="#ffffff" stroke-width="6" filter="url(#shadow)"/>
    <rect x="0" y="0" width="35" height="35" rx="17.5" fill="#ef4444"/>
    <line x1="35" y1="0" x2="35" y2="35" stroke="#ffffff" stroke-width="4"/>
  </g>
</svg>
